name: Piyasa Bildirimi

on:
  schedule:
    # GitHub'in cron tetikleyicileri gecikebildigi icin sik araliklarla
    # kontrol edilir; asil karar scripts/zaman_kontrol.py'daki 'bugun bu
    # slot (ogle/aksam) gonderildi mi' takibiyle verilir.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bildirim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zaman kontrolu
        id: zaman
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manuel tetikleme, zaman kontrolu atlaniyor"
            echo "calis=evet" >> "$GITHUB_OUTPUT"
            echo "slot=manuel" >> "$GITHUB_OUTPUT"
          else
            if SLOT=$(python scripts/zaman_kontrol.py); then
              echo "calis=evet" >> "$GITHUB_OUTPUT"
              echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
            else
              echo "calis=hayir" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bagimliliklari kur
        if: steps.zaman.outputs.calis == 'evet'
        run: pip install -r requirements.txt

      - name: Teknik + temel analiz (portfoy)
        if: steps.zaman.outputs.calis == 'evet'
        run: python scripts/teknik_analiz.py

      - name: Firsat tarama (portfoy disi)
        if: steps.zaman.outputs.calis == 'evet'
        run: python scripts/firsat_tara.py

      - name: Karar olustur
        if: steps.zaman.outputs.calis == 'evet'
        run: python scripts/karar_ajani.py

      - name: Telegram'a gonder
        if: steps.zaman.outputs.calis == 'evet'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_bildirim.py

      - name: Slotu isaretle ve commitle
        if: steps.zaman.outputs.calis == 'evet' && github.event_name == 'schedule'
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import zaman_kontrol; zaman_kontrol.slot_isaretle('${{ steps.zaman.outputs.slot }}')"
          git config user.name "a-sirketi-bot"
          git config user.email "actions@github.com"
          git add data/son_bildirim.json
          git diff --cached --quiet || git commit -m "Bildirim slotu isaretlendi: ${{ steps.zaman.outputs.slot }}"
          git pull --rebase --autostash origin main
          git push
