name: Portfoy Dinleyici

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dinle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Telegram mesajlarini isle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_dinle.py

      - name: Degisiklikleri commitle
        run: |
          git config user.name "a-sirketi-bot"
          git config user.email "actions@github.com"
          git add config/portfolio.json data/telegram_offset.txt data/islem_gecmisi.json
          git diff --cached --quiet || git commit -m "Portfoy guncellendi (otomatik)"
          git pull --rebase --autostash origin main
          git push
